name: release

# Publishes to PyPI through Trusted Publishing: no token is stored
# anywhere. PyPI is told, once, that this repository and this workflow
# may publish this project, and the exchange happens over OIDC.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests, once more, against what is about to be published
        run: |
          python -m pip install --upgrade pytest
          python -m pytest tests/ -q

      - name: Build the distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Show what was built
        run: ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # the only permission Trusted Publishing needs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
